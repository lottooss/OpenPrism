[project]
name = "aim-agent-tooling"
version = "0.1.0"
description = "Python tooling, benchmarks, and dataset pipeline for OpenPrism"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [
    { name = "OpenPrism contributors" }
]
dependencies = [
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.20.0",
    "flatbuffers==25.12.19",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-jsonschema>=4.26.0",
    "types-pyyaml>=6.0.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.1.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"
