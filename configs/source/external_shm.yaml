# External Observation Source Profile: Shared Memory (Milestone M8-01)
# Allows external vision processes to feed canonical target observations via IPC.

observation_source:
  source_type: "shared_memory"
  shm_name: "aim_target_observations_shm"
  max_heartbeat_age_ms: 50.0
  require_heartbeat: true
  validate_schema: true
  expected_pipeline_run_id: 0
