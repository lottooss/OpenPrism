# Domain Profile: Aimlabs (Gridshot / Spidershot Benchmark)

safety:
  require_foreground_match: true
  target_process_name: "Aimlab_tb.exe"
  target_window_title: "aimlab"
  require_emergency_stop: true
  fail_closed: true
  max_active_engagement_seconds: 60.0

policy:
  plugin: "deterministic_utility"
  objective: "raw_score"
  horizon_targets: 3
  switch_hysteresis: 0.08
