# Scenario Profile: Tactical Second Domain (Humanoid Targets)
#
# Proves portability: targets are non-circular (tall humanoid aspect ratio 1:3),
# different FOV (90 deg vs 103 deg), different sensitivity (1.50 counts/px vs 1.25 counts/px),
# and different foreground process identity.
# Validated by schemas/config/scenario_profile.schema.json.

schema_version: 1
profile_id: "tactical_humanoid_sim"
default_target_value: 1.0
max_engagement_seconds: 90.0

capabilities:
  provides_target_value: true
  provides_crosshair_context: true
  provides_calibration_seed: true
  provides_foreground_identity: true
  reports_scenario_completion: true

foreground:
  process_name: "tactical_sim.exe"
  window_title_substring: "Tactical Domain"
  require_match: true

calibration_seed:
  counts_per_pixel_x: 1.50
  counts_per_pixel_y: 1.50
  fov_horizontal_deg: 90.0
  in_game_sensitivity: 1.2
  valid: true

crosshair:
  center_norm_x: 0.0
  center_norm_y: 0.0
  center_px_x: 960.0
  center_px_y: 540.0
  valid: true
